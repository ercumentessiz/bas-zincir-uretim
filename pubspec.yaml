name: bas_zincir
description: Baş Zincir üretim takip uygulaması - MVP
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  excel: ^4.0.6
  pdf: ^3.10.7
  path_provider: ^2.1.1
  share_plus: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/bas_zincir_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/bas_zincir_icon.png
