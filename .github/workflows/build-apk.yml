name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter surumunu goster
        run: flutter --version

      - name: Android platform dosyalarini olustur (yoksa)
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name bas_zincir --org com.baszincir .
          fi

      - name: Bagimliliklari indir
        run: flutter pub get

      - name: Uygulama adini ayarla
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Baş Zincir - Üretim"/' android/app/src/main/AndroidManifest.xml
          grep android:label android/app/src/main/AndroidManifest.xml

      - name: Uygulama ikonunu olustur
        run: dart run flutter_launcher_icons

      - name: Android SDK surumunu yukselt (share_plus icin gerekli)
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="android/app/build.gradle.kts"
          fi
          echo "Duzenlenen dosya: $GRADLE_FILE"
          echo "--- ONCESI ---"
          cat "$GRADLE_FILE"
          python3 - "$GRADLE_FILE" << 'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r'compileSdk(Version)?\s*=?\s*\S+', 'compileSdk = 35', content)
          content = re.sub(r'targetSdk(Version)?\s*=?\s*\S+', 'targetSdk = 35', content)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PYEOF
          echo "--- SONRASI ---"
          cat "$GRADLE_FILE"

      - name: APK derle (release)
        run: flutter build apk --release

      - name: APK'yi paylas
        uses: actions/upload-artifact@v4
        with:
          name: bas-zincir-apk
          path: build/app/outputs/flutter-apk/app-release.apk
