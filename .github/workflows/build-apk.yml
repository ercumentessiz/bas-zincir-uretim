name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Android platform dosyalarini olustur (yoksa)
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name bas_zincir --org com.baszincir .
          fi

      - name: Bagimliliklari indir
        run: flutter pub get

      - name: Uygulama adini ayarla
        run: sed -i 's/android:label="[^"]*"/android:label="Baş Zincir - Üretim"/' android/app/src/main/AndroidManifest.xml

      - name: Uygulama ikonunu olustur
        run: dart run flutter_launcher_icons

      - name: Android SDK surumunu yukselt
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="android/app/build.gradle.kts"
          fi
          echo "Duzenlenen dosya: $GRADLE_FILE"
          echo "--- ONCESI ---"
          cat "$GRADLE_FILE"
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$GRADLE_FILE"
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' "$GRADLE_FILE"
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' "$GRADLE_FILE"
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/' "$GRADLE_FILE"
          echo "--- SONRASI ---"
          cat "$GRADLE_FILE"

      - name: APK derle (release)
        run: flutter build apk --release

      - name: APK'yi paylas
        uses: actions/upload-artifact@v4
        with:
          name: bas-zincir-apk
          path: build/app/outputs/flutter-apk/app-release.apk
